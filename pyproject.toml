[project]
name = "kicad-bundle"
version = "0.1.0"
description = "Repackage official KiCad releases into small, self-contained kicad-cli bundles, and build the AVR and Arm toolchains simee ships"
requires-python = ">=3.11"
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.33",
]

[project.scripts]
kicad-bundle = "kicad_bundle.cli:main"
avr-toolchain = "avr_toolchain.cli:main"
arm-toolchain = "arm_toolchain.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kicad_bundle", "avr_toolchain", "arm_toolchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300  # per test: a hung test fails with a traceback instead of blocking the run (the slowest takes ~10 s)
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
