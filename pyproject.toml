[project]
name = "kicad-bundle"
version = "0.1.0"
description = "Repackage official KiCad releases into small, self-contained kicad-cli bundles"
requires-python = ">=3.11"
dependencies = ["pefile>=2023.2.7"]

[project.scripts]
kicad-bundle = "kicad_bundle.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kicad_bundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
