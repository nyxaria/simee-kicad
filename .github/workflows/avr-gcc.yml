name: avr-gcc
# Build the AVR toolchain (avr-gcc, binutils, avr-libc) that simee-core's package ships, for macOS arm64
# and x86_64, Linux x86_64 and Windows x86_64, and publish it as a release (avr-gcc-<gcc version>-<n>)
# with its sources. The versions are pinned in avr_toolchain/components.py; see README, "AVR toolchain".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (off = build and check only)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  macos:  # arm64 natively, then x86_64 cross-built with it and checked under Rosetta
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Rosetta (to check the x86_64 toolchain on this arm64 runner)
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kicad-bundle/avr-gcc-sources
          key: avr-gcc-sources-${{ hashFiles('avr_toolchain/components.py') }}
      - run: uv run avr-toolchain build --host macos-arm64
      - run: uv run avr-toolchain build --host macos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:  # Linux natively, then Windows cross-built with mingw-w64, on Debian 12 (glibc 2.36)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 180
    env:
      UV_PYTHON: "3.12"  # tarfile's extraction filters
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential m4 g++-mingw-w64-x86-64-win32 \
            ca-certificates curl git xz-utils bzip2
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kicad-bundle/avr-gcc-sources
            ~/.cache/kicad-bundle/debian-sources
          key: avr-gcc-linux-sources-${{ hashFiles('avr_toolchain/components.py') }}
          restore-keys: avr-gcc-linux-sources-
      - run: uv run avr-toolchain build --host linux-x86_64
      - run: uv run avr-toolchain build --host windows-x86_64
      - name: Sources (the toolchain's, and the Debian runtime's both link statically)
        run: uv run avr-toolchain sources --runtime-of linux-x86_64 --runtime-of windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:  # checks the Windows toolchain where it runs
    needs: linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - run: uv run avr-toolchain check (Get-Item dist/avr-gcc-*-windows-x86_64.zip).FullName

  release:
    needs: [macos, linux, windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          gh release list --limit 500 --json tagName -q '.[].tagName' > tags.txt
          tag=$(uv run python -m avr_toolchain.publish --dist dist --tags tags.txt \
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest=false \
            --title "avr-gcc ${tag#avr-gcc-}" --notes-file notes.md
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
