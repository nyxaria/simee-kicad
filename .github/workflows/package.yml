name: package
# Repackage an official KiCad release into trimmed kicad-cli bundles and publish them as a
# release (cli-<version>-<n>). simee-core pins a release; simee-agents's kicad-sync job triggers this weekly.
# With simee_ref, KiCad's own files are built from that simee-kicad branch instead (see README).
# A release-candidate rehearsal (README) builds only Linux, on base_image, and never publishes.

on:
  workflow_dispatch:
    inputs:
      kicad_version:
        description: Official KiCad release to package, e.g. 10.0.6
        required: true
      simee_ref:
        description: simee-kicad branch to build KiCad's own files from, e.g. simee/10.0.6 (empty = official binaries)
        required: false
        default: ""
      publish:
        description: Publish a release (off = build and smoke-test only)
        type: boolean
        default: true
      platforms:
        description: Platforms to build (a release needs all three)
        required: false
        default: linux macos windows
      base_image:
        description: "Linux: build on this image instead of kicad/kicad:<version>, e.g. kicad/kicad:10.0.6 for a release candidate (needs simee_ref; never published)"
        required: false
        default: ""

permissions:
  contents: write

env:
  KICAD_VERSION: ${{ inputs.kicad_version }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  ref:  # one commit for every platform, even if the branch moves during the run
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: A release needs every platform, each from its own version's official build
        if: inputs.publish && (inputs.platforms != 'linux macos windows' || inputs.base_image != '')
        run: |
          echo "publish needs platforms 'linux macos windows' and no base_image" >&2
          exit 1
      - id: resolve
        env:
          SIMEE_REF: ${{ inputs.simee_ref }}
        run: |
          if [ -n "$SIMEE_REF" ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "$SIMEE_REF" | cut -f1 | head -1)
            [ -n "$sha" ] || { echo "no ref $SIMEE_REF" >&2; exit 1; }
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: ref
    if: contains(inputs.platforms, 'macos')
    env:
      SIMEE_SHA: ${{ needs.ref.outputs.sha }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Rosetta (to smoke-test the x86_64 bundle on this arm64 runner)
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kicad-bundle/${{ inputs.kicad_version }}
          key: kicad-installers-macos-${{ inputs.kicad_version }}
      - uses: actions/cache@v4  # third-party sources and Homebrew bottle records, mostly shared between releases
        with:
          path: |
            ~/.cache/kicad-bundle/macos-sources
            ~/.cache/kicad-bundle/homebrew-bottles
          key: macos-sources-${{ inputs.kicad_version }}
          restore-keys: macos-sources-
      - name: Build tools (KiCad's own files are built from simee_ref)
        if: needs.ref.outputs.sha != ''
        # Xcode 16.2 (macOS 15.2 SDK), which the official 10.0.x build used. The image's default,
        # 15.4, lacks C++20 library features KiCad 10 needs (std::views::join).
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          brew install swig ninja
      - run: uv run kicad-bundle --kicad-version "$KICAD_VERSION" --platform macos --out dist ${SIMEE_SHA:+--simee-ref "$SIMEE_SHA"}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    needs: ref
    if: contains(inputs.platforms, 'windows')
    env:
      SIMEE_SHA: ${{ needs.ref.outputs.sha }}
    # Visual Studio 2022 with MSVC 14.44, which linked KiCad 10.0.x: a simee build must use the official
    # build's MSVC (windows_build checks). Building every vcpkg port takes hours the first time.
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kicad-bundle/${{ inputs.kicad_version }}
          key: kicad-installers-windows-${{ inputs.kicad_version }}
      - uses: actions/cache@v4  # vcpkg ports' sources and the registry clones, mostly shared between releases
        with:
          path: |
            ~/.cache/kicad-bundle/windows-sources
            ~/.cache/kicad-bundle/vcpkg-registries
          key: windows-sources-${{ inputs.kicad_version }}
          restore-keys: windows-sources-
      - name: Restore vcpkg's builds of the ports (simee builds)
        if: needs.ref.outputs.sha != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kicad-bundle/vcpkg-binaries
          key: vcpkg-binaries-${{ inputs.kicad_version }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-binaries-${{ inputs.kicad_version }}-
            vcpkg-binaries-
      - run: uv run kicad-bundle --kicad-version "$env:KICAD_VERSION" --platform windows --out dist --work C:\w $(if ($env:SIMEE_SHA) { "--simee-ref", $env:SIMEE_SHA })
        timeout-minutes: 330  # leaves time to save the ports built so far, so a rerun carries on
      - name: Save vcpkg's builds of the ports
        if: always() && needs.ref.outputs.sha != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kicad-bundle/vcpkg-binaries
          key: vcpkg-binaries-${{ inputs.kicad_version }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: ref
    if: contains(inputs.platforms, 'linux')
    env:
      SIMEE_SHA: ${{ needs.ref.outputs.sha }}
      BASE_IMAGE: ${{ inputs.base_image }}
    runs-on: ubuntu-latest  # has docker: the official kicad/kicad image, smoke-tested in ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4  # the Debian sources, keyed by sha1, so most carry over between releases
        with:
          path: ~/.cache/kicad-bundle
          key: debian-sources-${{ inputs.kicad_version }}
          restore-keys: debian-sources-
      - run: uv run kicad-bundle --kicad-version "$KICAD_VERSION" --platform linux --out dist ${SIMEE_SHA:+--simee-ref "$SIMEE_SHA"} ${BASE_IMAGE:+--base-image "$BASE_IMAGE"}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [ref, macos, windows, linux]
    env:
      SIMEE_SHA: ${{ needs.ref.outputs.sha }}
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the corresponding KiCad source (GPL; a simee build already made it)
        if: needs.ref.outputs.sha == ''
        run: >
          curl -fsSL -o "dist/kicad-$KICAD_VERSION-source.tar.gz"
          "https://github.com/KiCad/kicad-source-mirror/archive/refs/tags/$KICAD_VERSION.tar.gz"
      - name: Publish
        run: |
          gh release list --limit 500 --json tagName -q '.[].tagName' > tags.txt
          tag=$(uv run python -m kicad_bundle.publish --kicad-version "$KICAD_VERSION" --dist dist \
                --tags tags.txt --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                ${SIMEE_SHA:+--simee-sha "$SIMEE_SHA"})
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "kicad-cli $KICAD_VERSION (${tag##*-})" --notes-file notes.md
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
